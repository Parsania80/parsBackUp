[workspace]
resolver = "2"
members = [
  "crates/backup-domain",
  "crates/backup-application",
  "crates/backup-postgres",
  "crates/backup-local",
  "crates/backup-crypto",
  "crates/backup-inventory",
  "crates/backupctl",
  "crates/backup-api",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1"
uuid = { version = "1.26", features = ["v4", "serde"] }

# Keep the age/core pair together: FileKey and recipient traits cross this boundary.
# The patched 0.11 stream supports our frozen custom recipient without 0.12's
# unconditional P-256/crypto-bigint dependency (RUSTSEC-2026-0387). Cross-version
# ciphertext and signature vectors gate this choice; no wire format is downgraded.
age = "=0.11.5"
age-core = "=0.11.0"
base64 = "0.22"
hkdf = "0.12"

# Only for `flock`: the job lock is held by the kernel, so nothing in this workspace has to decide
# what a stale lock means. Already in the tree via `getrandom`, so this adds no crate.
libc = "0.2"
# Our custom KEM supplies both key-agreement legs. Built-in P-256 and X25519 KEMs
# are unnecessary; keep the same HPKE implementation with alloc only.
hpke = { version = "=0.12.0", default-features = false, features = ["alloc"] }
ml-kem = { version = "0.2", features = ["deterministic"] }
rand = "0.8"
sha3 = "0.10"
typenum = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# The M5 inventory engine, measured rather than assumed (ADR 0003): `bundled` because the
# system libsqlite3 does not link on this host and would tie the inventory format to whatever
# version the distro ships, and `default-features = false` because the statement cache those
# features bring in is worth 5 KB and three crates to a CLI that opens the database, runs a
# handful of statements, and exits. `modern_sqlite` stays on: the pragmas ADR 0003 depends on
# (`busy_timeout` read-back, `user_version`) are asserted from the connection, not assumed.
# 0.41.1 resolves patched libsqlite3-sys 0.39.1 (RUSTSEC-2026-0459).
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }

# The M4b origin signature, pinned for two specific reasons. `ed25519-dalek` stays on
# 2.x because 3.0 resolves a second, incompatible `curve25519-dalek`; 2.2 uses the 4.1.3
# that `age` and `x25519-dalek` already lock, so the binary carries one copy of the curve.
# `ml-dsa` must stay at or above 0.1.1: GHSA-5x2r-hc65-25f9 (a malleable ML-DSA hint
# region) is fixed in 0.1.0-rc.4, and 0.1.1 is the first release after it.
# `zeroize` is not a default for `ml-dsa`, and it is the reason the secret half of a
# signing key is wiped; `signing` asserts the resulting `ZeroizeOnDrop` bounds so
# dropping these features breaks the build instead of quietly weakening the guarantee.
# Neither crate needs an RNG here: signing keys are built from seeds this crate draws
# from `rand`, and both signature schemes are deterministic.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1"
