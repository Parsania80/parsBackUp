[workspace]
resolver = "2"
members = [
  "crates/backup-domain",
  "crates/backup-application",
  "crates/backup-postgres",
  "crates/backup-local",
  "crates/backupctl",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1"
uuid = { version = "1.26", features = ["v4", "serde"] }
