[workspace]
resolver = "2"
members = [
  "crates/backup-domain",
  "crates/backup-application",
  "crates/backup-postgres",
  "crates/backup-local",
  "crates/backup-crypto",
  "crates/backupctl",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1"
uuid = { version = "1.26", features = ["v4", "serde"] }

# Pinned as a set, not individually: a custom age recipient implements traits
# from `age` using `age_core`'s re-exported `hpke`/`rand`/`secrecy` types, so any
# version drift between them is a type error at the trait boundary rather than a
# compilable mismatch. Update all of these together, against the versions the
# chosen `age` release resolves to.
age = "=0.12.1"
age-core = "=0.12.0"
base64 = "0.22"
hkdf = "0.12"
hpke = "0.12"
ml-kem = { version = "0.2", features = ["deterministic"] }
rand = "0.8"
sha3 = "0.10"
typenum = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# The M4b origin signature, pinned for two specific reasons. `ed25519-dalek` stays on
# 2.x because 3.0 resolves a second, incompatible `curve25519-dalek`; 2.2 uses the 4.1.3
# that `age` and `x25519-dalek` already lock, so the binary carries one copy of the curve.
# `ml-dsa` must stay at or above 0.1.1: GHSA-5x2r-hc65-25f9 (a malleable ML-DSA hint
# region) is fixed in 0.1.0-rc.4, and 0.1.1 is the first release after it.
# `zeroize` is not a default for `ml-dsa`, and it is the reason the secret half of a
# signing key is wiped; `signing` asserts the resulting `ZeroizeOnDrop` bounds so
# dropping these features breaks the build instead of quietly weakening the guarantee.
# Neither crate needs an RNG here: signing keys are built from seeds this crate draws
# from `rand`, and both signature schemes are deterministic.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1"
