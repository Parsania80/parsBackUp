# M4a adds an [encryption] block to the M3 configuration. It is the only way to
# turn encryption on: there is no per-run flag to forget. Without this block every
# artifact is written in the plaintext layout the M1-M3 guides describe.
# Replace these absolute paths with paths on the machine running backupctl.
timeout_seconds = 300

# Cluster role and membership metadata. With [encryption] below it is sealed as
# globals.age instead of written as globals.sql.
export_globals = true

[source]
host = "127.0.0.1"
port = 55432
user = "postgres"
database = "backupctl_fixture_m1"
client_bin_dir = "/usr/lib/postgresql/16/bin"
# password_file = "/absolute/path/to/0600/pgpass"

[storage]
root = "/tmp/backupctl-m4a-data"

# Both paths must be absolute and must live outside the storage root: an encrypted
# archive in a directory that also holds the identity that opens it is a plaintext
# archive with extra steps. `config check` and `key generate` both refuse otherwise.
#
# Create them with `backupctl --config this-file.toml key generate`, which writes the
# identity at mode 0600 and its public recipient half at 0644, and never overwrites an
# existing file. A backup host that may only write needs the recipient_file and nothing
# else; verifying or restoring needs both.
#
# If you supply the identity yourself instead, write it at mode 0600 and run
# `backupctl --config this-file.toml key publish`: it reads the identity, refuses one this
# store would not open, and writes only the recipient half. Neither command modifies an
# identity that already exists.
#
# One pair is one generation: rotating means a new key directory and a new configuration,
# and an older artifact stays readable only through the pair that wrote it. Keep an
# offline copy of every generation's identity before you need it; the rotation and
# key-loss procedures are in docs/security/key-lifecycle.md.
[encryption]
identity_file = "/var/lib/backupctl-keys/identity.key"
recipient_file = "/var/lib/backupctl-keys/recipient.key"

# M4b adds an optional [signing] block. Together these two blocks are the only way to say
# what a store writes; there is no per-run flag for either. Three shapes, and nothing else:
#
#   no key blocks    payload.dump + globals.sql + manifest.json   m1-development-plaintext
#                    the M1-M3 layout, readable without any key.
#   [encryption]     payload.age + manifest.json                  m4a-development-age
#                    encrypted and unsigned. Development only: the manifest beside the
#                    ciphertext is plaintext, and anyone holding the recipient key can
#                    write an artifact this store will restore.
#   [encryption] + [signing]  payload.age + manifest.age + public.json + signature.hybrid
#                    artifact v1, the frozen format. The manifest is encrypted, and a
#                    replaced, downgraded or re-encrypted artifact fails before anything is
#                    decrypted or restored.
#
# A [signing] block with no [encryption] block is refused at load: the signature is made
# over the two ciphertext files, so a store that writes plaintext has nothing for it to
# authenticate.
#
# The same path rules as [encryption] apply — absolute, outside the storage root, never
# overwritten — but the two files here are distributed differently, and that difference is
# the point of the block:
#
#   signing_key_file    0600, the secret seed. Only a host that creates backups has it.
#                       A host that verifies or restores must NOT have it, and omitting the
#                       key is what makes that provable rather than a matter of trust.
#   verifying_key_file  0644, the trusted public half. Every reader needs it, and it is
#                       installed independently of the artifact store: a verifying key
#                       copied out of the store it checks proves nothing.
#
# Create both with `backupctl --config this-file.toml key generate`. A read-only or DR host
# configures the verifying half alone:
#
# [signing]
# verifying_key_file = "/var/lib/backupctl-keys/verifying.key"
#
# One signing pair is one generation, exactly like the age pair, and rotation is the same
# procedure (docs/security/key-lifecycle.md). Losing the signing key does not lose the data
# — the artifacts stay readable with the identity and a re-installed verifying key for that
# generation — but nothing new can be published until a new pair is created.
[signing]
signing_key_file = "/var/lib/backupctl-keys/signing.key"
verifying_key_file = "/var/lib/backupctl-keys/verifying.key"
