# Inert example. Review the listen address, name, certificate paths and API port.
# The browser URL must exactly match public_origin in api.toml.
server {
    listen 127.0.0.1:8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/backupctl-web.crt;
    ssl_certificate_key /etc/nginx/tls/backupctl-web.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/backupctl-web/www;
    index index.html;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location ^~ /api/v1/ {
        client_max_body_size 16k;
        client_body_buffer_size 16k;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8090;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
